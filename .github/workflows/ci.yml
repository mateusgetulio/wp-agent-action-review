name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: ramsey/composer-install@v3

      - name: Pinned dependencies
        run: composer deps

      - name: Syntax
        run: composer lint

      - name: WordPress Coding Standards
        if: matrix.php == '8.3'
        run: composer phpcs

      - name: PHPStan
        if: matrix.php == '8.3'
        run: composer phpstan

      - name: Unit tests
        run: composer test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ramsey/composer-install@v3

      - name: Pinned dependencies
        run: composer deps

      - name: Start WordPress
        run: npx --yes @wordpress/env@11.15.0 start

      - name: Integration tests
        run: bin/integration-tests.sh
